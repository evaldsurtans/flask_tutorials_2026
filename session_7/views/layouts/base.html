<!DOCTYPE html>
    <html lang="en">
    <head>
        <script src="https://kit.fontawesome.com/7129b4e717.js" crossorigin="anonymous"></script>
        <meta charset="UTF-8">
        <title>{% block title %}Blog{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='build.css') }}" />
        {% block head %}{% endblock %}
    </head>
    <body>

    <div class="drawer m-2 w-fit">
        <input id="my-drawer-1" type="checkbox" class="drawer-toggle" />
        <div class="drawer-content">
            <label for="my-drawer-1" class="btn drawer-button fixed top-2 left-2">Menu</label>
        </div>
        <div class="drawer-side">
            <label for="my-drawer-1" aria-label="close sidebar" class="drawer-overlay"></label>
            <ul class="menu bg-base-200 min-h-full w-80 p-4">
                {% if session %}
                <li><form action="{{url_for('auth.logout')}}" method="POST">
                    <button type="submit">Logout</button>
                </form></li>
                {% else %}
                <li><a href="{{url_for('auth.login')}}">Login</a></li>
                {% endif %}
                <li>
                    <a href="{{url_for('home')}}">Posts</a>
                </li>
                <li>
                    <a href="{{url_for('tags.view_tags')}}">Tags</a>
                </li>
            </ul>
        </div>
    </div>

    {% block content%}

    <span>Not found</span>

    {% endblock %}
    </body>
</html>
